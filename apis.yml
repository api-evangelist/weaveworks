name: Weaveworks
description: >-
  Weaveworks was the cloud-native company that coined the term "GitOps" and built the Weave
  family of open-source infrastructure tooling — Weave Net (multi-host container networking),
  Weave Scope (Docker/Kubernetes visualization and monitoring), Weave GitOps, and the widely
  used eksctl CLI for Amazon EKS. Backed by Accel and GV, the company ceased commercial
  operations in February 2024 after a planned acquisition fell through. It shipped no hosted
  REST API or client SDKs; its public surface was open-source Go tooling. Following the
  shutdown, Flux CD moved to the CNCF (graduated), eksctl transferred to the eksctl-io org
  jointly maintained with AWS, and the remaining Weave repositories became community-driven
  under the github.com/weaveworks organization. The former company website (weave.works) has
  lapsed and now redirects to a parked page.
